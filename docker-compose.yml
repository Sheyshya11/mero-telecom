services:
  postgres:
    image: postgres:17-alpine
    container_name: mero-telecom-postgres
    environment:
      POSTGRES_DB: mero_telecom
      POSTGRES_USER: mero_telecom
      POSTGRES_PASSWORD: mero_telecom_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mero_telecom -d mero_telecom']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mero-telecom-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mero-telecom-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  postgres-test:
    profiles: ['test']
    image: postgres:17-alpine
    container_name: mero-telecom-postgres-test
    environment:
      POSTGRES_DB: mero_telecom_test
      POSTGRES_USER: mero_telecom
      POSTGRES_PASSWORD: mero_telecom_test_password
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mero_telecom -d mero_telecom_test']
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    profiles: ['test']
    image: redis:7-alpine
    container_name: mero-telecom-redis-test
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
